<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>StayLens — Full Judgement Flow</title>
<style>
  /* ═══════════════════════════════════════════════════════════
     STAYLENS — Typography Design System v6
     目标：文华东方的优雅克制 × Google 的清晰效率
     ═══════════════════════════════════════════════════════════

     FONT ARCHITECTURE（三字体系统）
     ────────────────────────────────────────────────────────
     --font-display  Playfair Display + Noto Serif SC
                     → 封面品牌 H1，仅此一处
                     → 理由：无可替代的奢华气质落点

     --font-heading  Cormorant Garamond + Noto Serif SC
                     → 所有模块一级标题（.title .dimtitle .group-title 等）
                     → 理由：文华东方式的"精致但不装"
                             比 Playfair 更轻盈，比无衬线更有温度
                             中文回落 Noto Serif SC，气质一致

     --font-body     Tenor Sans + Noto Sans SC
                     → 所有正文、表单、说明、按钮、标签
                     → 理由：Tenor Sans 专为奢侈品牌场景设计
                             与 Cormorant 同属人文主义字体谱系
                             笔划有粗细对比，修长比例，无科技感

     --font-mono     DM Mono
                     → 所有数字评分（scorepill, dim-chip-score,
                       summary-big, dimavg strong, big-level）
                     → 理由：数字用等宽字体，精准感 + 视觉区隔
                             避免与标题和正文字体的模糊感混淆

     TYPE SCALE（严格，禁止感觉调整）
     ────────────────────────────────────────────────────────
     --ts-09 :  9px  → 极微：范围标注 1.0 · 3.0 · 5.0
     --ts-11 : 11px  → 微型：kicker / badge / label
     --ts-13 : 13px  → 正文基础：body / hint / anchor / desc
     --ts-15 : 15px  → 强调正文：item title / option title
     --ts-17 : 17px  → 卡片标题：group/choice/result card title
     --ts-22 : 22px  → 模块标题：dimtitle / section title（Cormorant）
     --ts-28 : 28px  → 大数字辅助 / dimavg
     --ts-44 : 44px  → 总评大数字 / result big level

     WEIGHT MAP
     ────────────────────────────────────────────────────────
     Jost 300   → placeholder、极次要说明
     Jost 400   → 正文 body、desc、hint
     Jost 500   → 次级强调：option label、button、chip
     Jost 600   → 首要强调：kicker（大写字母本身已有重量）
     Cormorant  → 用 500（它的 500 已相当于正常 sans 的 700）
     DM Mono    → 400（等宽字体不需要加粗，字形本身有力量）
     禁止任何地方出现 700+

     LETTER-SPACING 哲学
     ────────────────────────────────────────────────────────
     Cormorant 标题：-0.01em（衬线字体微收，更精致）
     Tenor 正文：    0 到 +0.015em（人文字体需要微开，透气感）
     Tenor 小号：    +0.01em 到 +0.02em（小字号配合大写更好看）
     Kicker：        +0.15em（大写字母必须拉开，这是风格的来源）
     DM Mono 数字：  -0.03em 到 -0.05em（数字需要紧凑感）

     LINE-HEIGHT 哲学
     ────────────────────────────────────────────────────────
     Cormorant 标题：1.15～1.22（衬线字体行高不能过大）
     Tenor 正文：    1.72～1.82（中英混排充分透气）
     Anchor/微型：   1.60～1.65（密集信息区适当收紧）
     数字：          1（大数字独占，不需要行高）
     ═══════════════════════════════════════════════════════════ */

  :root {
    /* ── 颜色系统（保持原有温暖色调）── */
    --bg:           #F6F2EB;
    --surface:      #FFFFFF;
    --surface-2:    rgba(246,242,235,.88);
    --ink:          #1a1612;
    --ink-2:        #5c5248;
    --ink-3:        #9a9088;
    --gold:         #8C7A5B;
    --gold-soft:    rgba(140,122,91,.07);
    --gold-line:    rgba(140,122,91,.20);
    --line:         rgba(231,225,216,.90);
    --line-soft:    rgba(231,225,216,.70);
    --ok:           #4a7a52;
    --ok-soft:      rgba(74,122,82,.09);
    --warn:         #8a6830;
    --warn-soft:    rgba(138,104,48,.09);
    --danger:       #b04040;
    --danger-soft:  rgba(176,64,64,.09);
    --shadow:       0 1px 3px rgba(26,22,18,.03), 0 12px 36px rgba(26,22,18,.05);

    /* ── 字体系统（三字体架构）── */
    --font-display: "Playfair Display", "Noto Serif SC", Georgia, serif;
    --font-heading: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
    --font-body:    "Tenor Sans", "Noto Serif SC", "Songti SC", Georgia, serif;
    --font-mono:    "DM Mono", "SF Mono", "Menlo", "Consolas", monospace;

    /* ── 字号体系（严格 8 档）── */
    --ts-09:  9px;
    --ts-11: 11px;
    --ts-13: 13px;
    --ts-15: 15px;
    --ts-17: 17px;
    --ts-22: 22px;
    --ts-28: 28px;
    --ts-44: 44px;

    /* ── 数字渲染 ── */
    --num-feat: tabular-nums lining-nums;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #F6F2EB !important;
    color-scheme: light;
  }

  /* ── Form typography hard lock ── */
  input,
  select,
  textarea {
    font-family: var(--font-body) !important;
    color: var(--ink) !important;
  }

  input::placeholder,
  select::placeholder,
  textarea::placeholder {
    font-family: var(--font-body) !important;
    color: var(--ink-3) !important;
    opacity: 1;
  }


  body {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    font-weight: 400;
    line-height: 1.72;
    letter-spacing: 0.005em;
    color: var(--ink);
    background: #F6F2EB;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  .app{max-width:1080px;margin:0 auto;padding:26px 18px 44px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .back{display:none}

  /* Step label — kicker tier */
  .step{
    font-family: var(--font-body);
    font-size: var(--ts-11);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    white-space: nowrap;
  }
  .progress{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:8px;max-width:700px}
  .bar{height:4px;border-radius:0;background:#e6ddd1;position:relative;overflow:hidden}
  .bar.active{background:var(--gold)}
  .bar.partial::after{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(var(--fill, 0) * 100%);background:var(--gold);opacity:.45;border-radius:0}
  .topbar.cover-topbar{display:none !important;margin:0 !important}
  .topbar.cover-topbar .step,
  .topbar.cover-topbar .progress{display:none}
  #pageHost{opacity:1}
  .stage-shell-enter{animation:stageFadeIn .28s ease both}
  .stage-shell-exit{animation:stageFadeOut .18s ease both}
  @keyframes stageFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes stageFadeOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-4px)}}

  .hero,.card,.main,.summary-overall,.summary-dims,.result-main,.result-card,.result-wide,.group-card,.choice-card,.copy-box{
    background:var(--surface);
    border:0.5px solid rgba(26,22,18,.09);
    box-shadow:0 1px 3px rgba(26,22,18,.03), 0 10px 32px rgba(26,22,18,.055);
  }
  .hero,.main,.result-main,.result-wide,.copy-box{border-radius:0}
  .summary-overall,.summary-dims,.result-card,.group-card,.choice-card{border-radius:0}

  .hero{padding:36px 44px 30px;margin-bottom:16px}

  /* ── Kicker：Jost 600，字距拉开至 0.15em，这是整套系统的风格锚点 ── */
  .kicker,
  .card-kicker,
  .dimtag,
  .itembadge,
  .summary-label,
  .mode-subtitle,
  .mode-section-label,
  .subcheck-title {
    font-family: var(--font-body) !important;
    font-size: var(--ts-11) !important;
    font-weight: 500 !important;
    letter-spacing: 0.16em !important;
    text-transform: uppercase !important;
    color: rgba(154,135,110,.78) !important;
    line-height: 1.0 !important;
    margin-bottom: 8px;
    display: block;
  }
  /* Gold-tinted kicker for top-level page section kickers */
  .kicker { color: rgba(154,127,82,.82) !important; }

  /* ── Section title: Cormorant，模块标题层 ── */
  .title {
    font-family: var(--font-heading);
    font-size: var(--ts-22);
    line-height: 1.45;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    font-weight: 500;
    color: var(--ink);
  }

  /* ── 正文描述：Jost 400，中英混排最佳参数 ── */
  .desc {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.82;
    color: rgba(92,82,72,.78);
    margin: 0;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* ── Hint box ── */
  .hint {
    margin-top: 18px;
    padding: 4px 0 4px 16px;
    border-radius: 0;
    background: transparent;
    border: none;
    border-left: 0.5px solid rgba(154,127,82,.35);
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.78;
    color: rgba(92,82,72,.58);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .summary-strip{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-bottom:16px}
  .summary-overall{padding:22px 24px}
  .summary-dims{padding:20px 22px}

  .summary-score-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}

  /* ── 总评大分：DM Mono，数字精准感 ── */
  .summary-big {
    font-family: var(--font-mono);
    font-size: var(--ts-44);
    line-height: 1;
    letter-spacing: -0.04em;
    font-weight: 400;
    color: var(--ink);
    font-variant-numeric: var(--num-feat);
  }

  .summary-text {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.75;
    color: rgba(92,82,72,.70);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .dim-chip-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .dim-chip{display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px;border-radius:0;background:rgba(255,255,255,.78);border:0.5px solid var(--line-soft);min-height:92px}
  .dim-chip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

  /* dim-chip-index uses kicker styles via .kicker class extension */
  .dim-chip-index {
    font-family: var(--font-body);
    font-size: var(--ts-11);
    letter-spacing: .10em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
    margin-bottom: 4px;
  }

  /* ── Dimension chip name：Cormorant ── */
  .dim-chip-name {
    font-family: var(--font-heading);
    font-size: 14px;
    line-height: 1.28;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  /* ── 维度分数：DM Mono ── */
  .dim-chip-score {
    font-family: var(--font-mono);
    font-size: 22px;
    line-height: 1;
    color: var(--ink);
    font-weight: 400;
    letter-spacing: -0.03em;
    flex: none;
    font-variant-numeric: var(--num-feat);
  }

  .dim-chip-bar{height:5px;border-radius:0;background:rgba(28,24,20,.06);overflow:hidden}
  .dim-chip-fill{height:100%;border-radius:0;background:linear-gradient(90deg, rgba(140,122,91,.35), rgba(140,122,91,.92));transition:width .3s ease}

  /* ── 维度 chip 三态 ── */
  /* 当前：金色边框高亮，背景微暖 */
  .dim-chip.dim-chip-active {
    border-color: rgba(140,122,91,.55) !important;
    background: rgba(246,242,235,.98) !important;
    box-shadow: 0 0 0 1px rgba(140,122,91,.18);
    transition: all .2s ease;
  }
  .dim-chip.dim-chip-active .dim-chip-index { color: var(--gold) !important; }
  .dim-chip.dim-chip-active .dim-chip-name  { color: var(--ink) !important; }
  .dim-chip.dim-chip-active .dim-chip-score { color: var(--gold) !important; }
  .dim-chip.dim-chip-active .dim-chip-fill  { background: linear-gradient(90deg, rgba(140,122,91,.55), rgba(140,122,91,1)); }

  /* 已完成：深色系，表示有结果 */
  .dim-chip.dim-chip-visited {
    background: rgba(255,255,255,.92) !important;
    border-color: rgba(26,22,18,.10) !important;
    transition: all .2s ease;
  }
  .dim-chip.dim-chip-visited .dim-chip-index { color: rgba(92,82,72,.55); }
  .dim-chip.dim-chip-visited .dim-chip-name  { color: var(--ink); }
  .dim-chip.dim-chip-visited .dim-chip-score { color: var(--ink); }

  /* 未开始：整体淡出，进度条变灰 */
  .dim-chip.dim-chip-pending {
    background: rgba(255,255,255,.50) !important;
    border-color: rgba(26,22,18,.05) !important;
    transition: all .2s ease;
  }
  .dim-chip.dim-chip-pending .dim-chip-index { color: rgba(92,82,72,.30); }
  .dim-chip.dim-chip-pending .dim-chip-name  { color: rgba(26,22,18,.35); }
  .dim-chip.dim-chip-pending .dim-chip-score { color: rgba(26,22,18,.28); }
  .dim-chip.dim-chip-pending .dim-chip-fill  { background: rgba(28,24,20,.08); }

  /* ── Verdict pill：Jost 500 ── */
  .verdict {
    display: inline-flex;
    align-items: center;
    padding: 5px 12px;
    border-radius: 0;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .verdict.high{color:var(--ok);background:var(--ok-soft);border:1px solid rgba(79,122,87,.18)}
  .verdict.mid{color:var(--warn);background:var(--warn-soft);border:1px solid rgba(139,106,52,.18)}
  .verdict.low{color:var(--danger);background:var(--danger-soft);border:1px solid rgba(181,74,66,.18)}

  .main{overflow:hidden}
  .head{padding:40px 44px 30px;border-bottom:0.5px solid var(--line-soft);background:rgba(246,242,235,.72)}

  /* ── Dimension tag (kicker tier) ── */
  .dimtag {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 0;
    font-family: var(--font-body) !important;
    font-size: var(--ts-11) !important;
    letter-spacing: .14em !important;
    text-transform: uppercase !important;
    font-weight: 500 !important;
    color: var(--ink-3) !important;
    background: rgba(140,122,91,.08);
    border: 0.5px solid var(--gold-line);
    margin-bottom: 12px;
  }

  /* ── Dimension title: Cormorant，维度页主标题 ── */
  .dimtitle {
    font-family: var(--font-heading);
    font-size: 32px;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    font-weight: 500;
    color: var(--ink);
  }

  /* 维度核心判断说明 — Jost 300，静谧感 */
  .dimcore {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.80;
    color: rgba(92,82,72,.70);
    max-width: 760px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .items{padding:18px 44px 6px}
  .item{padding:30px 0 26px;border-bottom:1px solid rgba(26,22,18,.028)}
  .item:first-child{padding-top:22px}
  .item:last-child{border-bottom:none;padding-bottom:4px}

  /* ── Item badge (kicker tier) ── */
  .itembadge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 0;
    font-family: var(--font-body) !important;
    font-size: var(--ts-11) !important;
    letter-spacing: .12em !important;
    text-transform: uppercase !important;
    color: var(--ink-3) !important;
    border: 0.5px solid var(--line-soft);
    background: rgba(246,242,235,.88);
    font-weight: 500 !important;
    margin-bottom: 8px;
  }

  /* ── Item title：Cormorant，二级指标标题层 ── */
  .itemtitle {
    font-family: var(--font-heading);
    font-size: 20px;
    line-height: 1.28;
    letter-spacing: -0.01em;
    font-weight: 500;
    color: var(--ink);
  }

  /* ── Item hint：Jost 300，视觉休息层 ── */
  .itemhint {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.80;
    color: rgba(92,82,72,.72);
    margin-top: 5px;
    max-width: 720px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .scoreline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}

  /* ── 子项评分胶囊：DM Mono，无色块，仅边框 ── */
  .scorepill {
    min-width: 52px;
    text-align: center;
    padding: 5px 12px;
    border-radius: 0;
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    background: transparent;
    border: 0.5px solid rgba(140,122,91,.35);
    font-variant-numeric: var(--num-feat);
    letter-spacing: -0.05em;
  }

  .rangewrap{margin-top:8px}

  /* ── Range labels (12px) ── */
  .labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    color: var(--ink-3);
    margin-bottom: 8px;
    gap: 8px;
    font-weight: 400;
    letter-spacing: -.003em;
  }

  input[type="range"]{width:100%;accent-color:var(--gold);cursor:pointer}

  /* ── Anchor cards：精简，描述用 300 减轻视觉负担 ── */
  .anchors{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .anchor {
    background: rgba(246,242,235,.88);
    border: 0.5px solid var(--line-soft);
    border-radius: 0;
    padding: 10px 11px;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.62;
    color: rgba(92,82,72,.68);
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  /* Anchor score label — DM Mono */
  .anchor strong {
    display: block;
    font-family: var(--font-mono);
    font-size: var(--ts-13);
    font-weight: 400;
    color: var(--gold);
    margin-bottom: 3px;
    letter-spacing: -0.02em;
    font-variant-numeric: var(--num-feat);
  }

  .section-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:0 44px 24px}
  .group-card,.choice-card,.result-card{padding:18px 18px 16px}

  /* ── Card titles: Cormorant，卡片一级标题 ── */
  .group-title,
  .choice-title,
  .result-card h3,
  .result-wide h3 {
    font-family: var(--font-heading);
    font-size: var(--ts-22);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    font-weight: 500;
    color: var(--ink);
  }

  /* Card desc — Jost 300 */
  .group-desc,
  .choice-desc,
  .result-note,
  .choice-helper {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.78;
    color: rgba(92,82,72,.70);
    margin: 0 0 14px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .check-list,.radio-list{display:grid;gap:10px}

  /* ── Option rows ── */
  label.option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 0;
    background: rgba(246,242,235,.70);
    border: 0.5px solid var(--line-soft);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  label.option:hover {
    border-color: var(--gold-line);
    background: rgba(246,242,235,.95);
  }
  label.option input{margin-top:3px;accent-color:var(--gold)}

  /* Option title — Cormorant，选项标题 */
  .option strong {
    display: block;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.28;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  /* Option desc — Jost 300，轻盈辅助 */
  .option span {
    display: block;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.75;
    color: rgba(92,82,72,.65);
    margin-top: 2px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .rule-box {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 0;
    background: rgba(140,122,91,.06);

  .result-layout{display:grid;gap:16px}

    letter-spacing: -0.04em;

  /* Result summary — Cormorant，结论语句有质感 */

  /* ── Metric line numbers ── */
  .metric-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    color: rgba(92,82,72,.62);
    margin-top: 8px;
    font-weight: 400;

  /* Number in metric line — DM Mono */
  .metric-line strong {
    font-family: var(--font-mono);
    font-size: var(--ts-15);
    color: var(--ink);
    letter-spacing: -0.03em;
    font-weight: 400;
    font-variant-numeric: var(--num-feat);

  .copy-box{padding:20px 22px 18px}
  textarea {
    width: 100%;

    border: none;
    border-bottom: 1px solid var(--line);

    font-size: var(--ts-13);

    letter-spacing: 0.015em;
    color: var(--ink);

    font-weight: 400;

    outline: none;

  }

    color: #9A9285;
    font-weight: 400;

  }

  .note-panel{margin:18px 44px 0;padding:20px 0 0;border:none;background:transparent;border-radius:0;border-top:0.5px solid rgba(154,127,82,.25)}

  /* Note panel title — Cormorant */

    margin: 0 0 8px;
    font-family: var(--font-heading);
    font-size: var(--ts-17);
    line-height: 1.2;
    letter-spacing: -0.01em;
    font-weight: 500;
    color: var(--ink);
  }
  .note-panel p {
    margin: 0 0 12px;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.78;
    color: var(--ink-2);
    font-weight: 400;
  }
  .note-panel textarea{
    min-height:110px;
    background:transparent;
    border:none !important;
    border-bottom:0.5px solid rgba(26,22,18,.12) !important;

    padding-right:0 !important;

  .copy-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}

  .cover-shell{display:grid;gap:16px}
  .cover-main{padding:40px 42px 34px;border-radius:0;background:linear-gradient(135deg, rgba(255,255,255,.96) 0%, rgba(250,246,239,.94) 100%);border:1px solid var(--line);box-shadow:0 18px 50px rgba(28,24,20,.06)}

    text-transform: uppercase;
    color: var(--gold);

    margin-bottom: 14px;
  }

  /* Cover card brand title — Cormorant */
  .cover-title {
    font-family: var(--font-heading);
    font-size: 42px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    font-weight: 500;
    color: var(--ink);
  }

  .cover-subtitle {
    font-family: var(--font-body);
    font-size: var(--ts-15);
    line-height: 1.78;
    color: rgba(92,82,72,.70);
    max-width: 780px;
    margin: 0 0 20px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .cover-chip-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
  .cover-chip {
    display: inline-flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 0;
    background: rgba(246,242,235,.78);
    border: 0.5px solid var(--line-soft);
    font-family: var(--font-body);
    font-size: var(--ts-13);
    color: var(--ink-2);
    font-weight: 400;
  }

  .cover-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  .cover-card{padding:22px 22px 18px;border-radius:0;background:var(--surface);border:0.5px solid var(--line);box-shadow:var(--shadow)}

  /* Cover card heading — Cormorant */
  .cover-card h3 {
    margin: 0 0 10px;
    font-family: var(--font-heading);
    font-size: var(--ts-17);
    line-height: 1.2;
    letter-spacing: -0.01em;
    font-weight: 500;
    color: var(--ink);
  }
  .cover-card p {
    margin: 0 0 12px;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.78;
    color: var(--ink-2);
    font-weight: 400;
  }

  .cover-step-list{display:grid;gap:10px}
  .cover-step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:flex-start;padding:12px 12px;border-radius:0;background:rgba(246,242,235,.74);border:0.5px solid var(--line-soft)}
  .cover-step-no{width:30px;height:30px;border-radius:0;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);border:0.5px solid var(--gold-line);font-family:var(--font-mono);font-size:var(--ts-13);font-weight:400;color:var(--gold);font-variant-numeric:var(--num-feat)}

  /* Cover step text — Cormorant */
  .cover-step strong {
    display: block;
    font-family: var(--font-body);
    font-size: 16px;

    margin-bottom: 2px;
    font-weight: 500;

  .cover-step span {
    display: block;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.68;
    color: var(--ink-2);
    font-weight: 400;
  }
  .cover-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

  .subcheck-wrap{margin-top:14px;padding:14px 14px 6px;border-radius:0;background:rgba(140,122,91,.06);border:0.5px solid var(--gold-line)}

  /* Subcheck title — kicker tier */
  .subcheck-title {
    font-family: var(--font-body) !important;
    font-size: var(--ts-11) !important;
    letter-spacing: .12em !important;
    text-transform: uppercase !important;
    color: var(--gold) !important;
    font-weight: 500 !important;
    margin-bottom: 6px;
    display: block;
  }

  .subcheck-desc {
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.72;
    color: var(--ink-2);
    margin-bottom: 10px;
    font-weight: 400;
  }

  .subcheck-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .suboption{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:0;background:transparent;border:0.5px solid rgba(26,22,18,.06);transition:border-color .2s,background .2s}
  .suboption input{margin-top:2px;accent-color:var(--gold)}

  /* Suboption title — Cormorant */
  .suboption strong {
    display: block;
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.28;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .suboption span {
    display: block;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    line-height: 1.65;
    color: rgba(92,82,72,.62);
    margin-top: 3px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .subcheck-head,.compact-head,.detail-entry-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

  .mini-link {
    border: none;
    background: transparent;
    color: var(--gold);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 0;
    white-space: nowrap;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .detail-entry-row{margin-top:8px;padding:0 2px}
  .detail-entry-note {
    font-family: var(--font-body);
    font-size: 11px;
    line-height: 1.65;
    color: rgba(154,140,122,.80);
    font-weight: 400;
    letter-spacing: 0em;
  }

  /* ── Result / subjective / control grids ── */
  .subjective-grid,.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .subjective-block,.control-card{display:flex;flex-direction:column;gap:8px}

  /* Subjective / control labels — small, tracked */
  .subjective-block label,
  .control-card label {
    font-family: var(--font-body);
    font-size: var(--ts-11);
    font-weight: 500;

  .segmented{display:flex;flex-wrap:wrap;gap:8px}

     Everything else on the page uses --font-ui.
     ═══════════════════════════════════════════ */

    height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6vh 18px 48px;

    font-weight: 400;

    font-size: clamp(64px, 9vw, 108px);
    line-height: 1.0;
    letter-spacing: -0.015em;
    font-weight: 500;
    color: var(--ink);
  }

  /* Tagline：italic Jost 300，覆盖页气质句 */
  .tagline {
    font-family: var(--font-body);
    font-size: clamp(16px, 2vw, 24px);
    line-height: 1.45;
    letter-spacing: 0.005em;
    color: rgba(92,82,72,.74);
    margin: 18px 0 0;
    font-weight: 400;
    font-style: normal;
  }

  /* Cover footnote — 正常流布局，自动推到底部 */
  .cover-footnote {
    margin-top: auto;
    width: 560px;
    max-width: calc(100% - 36px);
    padding-top: 20px;

  .cover-footnote-lead,
  .cover-footnote-body {

    margin-left: auto;
    margin-right: auto;

    letter-spacing: 0.03em;
  }

  .cover-actions{margin-top:48px;display:flex;justify-content:center;width:100%}
  .cover-actions .btn.primary{min-width:184px;padding:14px 28px;border-radius:0;font-size:var(--ts-13);font-weight:500;box-shadow:none;letter-spacing:0.12em;text-transform:uppercase}
  .cover-actions .btn.primary:hover{transform:translateY(-1px)}

  /* ═══ MODE SELECTION ═══ */
  .mode-shell{background:rgba(255,255,255,.92);border:0.5px solid var(--line);border-radius:0;box-shadow:var(--shadow);padding:34px 36px}
  .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .mode-card{border:0.5px solid var(--line-soft);border-radius:0;padding:18px 16px 16px;background:rgba(255,255,255,.60);cursor:pointer;transition:.18s ease}
  .mode-card:hover{border-color:var(--gold-line);background:rgba(255,255,255,.80)}
  .mode-card.active{border-color:var(--gold);border-width:1px;background:rgba(255,255,255,.92);box-shadow:none}

  /* ── Mode card title: Cormorant ── */
  .mode-title {
    font-family: var(--font-heading);
    font-size: var(--ts-22);

  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

    align-items: center;
    padding: 6px 10px;
    border-radius: 0;
    background: rgba(246,242,235,.70);
    border: 0.5px solid var(--line-soft);
    font-family: var(--font-body);
    font-size: var(--ts-13);
    color: var(--ink-2);

    gap: 12px;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    color: var(--ink-2);
    font-weight: 400;
  }
  /* Weight value — DM Mono */
  .weight-item strong {
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: var(--ts-13);
    font-weight: 400;
    font-variant-numeric: var(--num-feat);

  }

  .weight-item.muted strong{color:var(--ink-3);font-weight:500}

  .preview-box {
    padding: 16px 18px;
    border-radius: 0;
    background: rgba(246,242,235,.70);
    border: 0.5px solid var(--line-soft);

    line-height: 1.78;

  .mode-card{padding:18px 16px 16px}
  .mode-compact-section{display:grid;gap:8px;margin-top:10px}
  .mode-section-card{padding:12px;border-radius:0;background:rgba(246,242,235,.78);border:0.5px solid var(--line-soft)}

    font-size: var(--ts-11) !important;

     ═════════════════════════════════════════════ */

    font-size: var(--ts-11);
    font-weight: 500;
    letter-spacing: 0.10em;

  /* ── Score zone ── */
  .score-zone { margin: 34px 0 0; }

  /* current value row — full width, sits above the grid */
  .score-current { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
  .score-current strong {
    font-family: var(--font-mono); font-size: 28px; line-height: 1;

  .score-current em {

  .score-grid { position: relative; }

  /* Tick row */
  .score-tick-row-inner { position: relative; height: 18px; margin-bottom: 8px; }
  .score-tick {
    position: absolute;
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: var(--ts-11);
    color: rgba(26,22,18,.18);

    top: 0;

  .score-tick.is-anchor { color: rgba(26,22,18,.34); }
  .score-tick.is-active { color: var(--gold); }

  /* Slider */
  .score-slider-wrap { margin: 0; }
  input[type="range"].v10-slider {
    display: block; width: 100%;
    accent-color: var(--gold); height: 1px; cursor: pointer; margin: 0;
  }

  /*
   * Active anchor: one label at a time, floats below the thumb.
   * JS sets its `left` to match thumb centre, then clamps so it
   * never overflows the container.
   */
  .score-anchor-row { position: relative; min-height: 28px; margin-top: 14px; }
  .score-active-label {
    position: absolute;
    top: 0;
    font-family: var(--font-body);
    font-size: var(--ts-13);
    color: var(--ink-2);
    line-height: 1.62;
    white-space: nowrap;

  /* ===== 溢价支撑条件：仅字体视觉修正，不改布局 ===== */

function getVisibleValueItems() {
  const modeKey = getCurrentModeKey();
  const items = Object.entries(VALUE_SUBITEMS)
    .filter(([_, item]) => item.modes.includes(modeKey))
    .map(([id, item]) => ({ id, ...item }));
  const total = items.reduce((sum, item) => sum + item.weight, 0) || 1;
  return items.map(item => ({ ...item, normalizedWeight: item.weight / total }));
}

function getValueScore() {
  const items = getVisibleValueItems();
  if (!items.length) return 3.0;
  const score = items.reduce((sum, item) => sum + (Number(state[item.id]) || 3) * item.normalizedWeight, 0);
  return Math.max(1, Math.min(5, score));
}

function getValueVerdictLabel(score = getValueScore()) {
  if (score >= 4.2) return '明显值得';
  if (score >= 3.6) return '略有惊喜';
  if (score >= 2.8) return '基本匹配';
  if (score >= 2.3) return '略微不值';
  return '明显不值';
}

function getProgressMeta(){
  if (currentStage === 0) return { stepText: '', units: [] };
  const units = [
    { key: 'mode', active: currentStage >= 1 ? 1 : 0 },
    { key: 'context', active: currentStage >= 2 ? 1 : 0 },
    { key: 'judgement', active: Math.max(0, Math.min(getVisibleDimensions().length, currentStage - 2)) / getVisibleDimensions().length },
    { key: 'risk', active: currentStage >= getRiskStage() ? 1 : 0 },
    { key: 'value', active: currentStage >= getValueStage() ? 1 : 0 },
    { key: 'result', active: currentStage >= getResultStage() ? 1 : 0 }
  ];
  const stepNum = currentStage <= 2 ? currentStage : currentStage <= getDimensionStageEnd() ? 3 : currentStage === getRiskStage() ? 4 : currentStage === getValueStage() ? 5 : 6;
  let label = '评价模式';
  if (currentStage === 2) label = '基础设定';
  else if (currentStage >= DIMENSION_STAGE_START && currentStage <= getDimensionStageEnd()) label = `体验判断 ${currentStage - 2} / ${getVisibleDimensions().length}`;
  else if (currentStage === getRiskStage()) label = '风险与修正';
  else if (currentStage === getValueStage()) label = '价值判断';
  else if (currentStage === getResultStage()) label = '最终结果';
  return { stepText: `Step ${stepNum} / ${TOTAL_STEPS} · ${label}`, units };
}

function buildProgress() {
  const wrap = document.getElementById('progress');
  const topbar = document.querySelector('.topbar');
  const stepTextEl = document.getElementById('stepText');
  const meta = getProgressMeta();
  if (currentStage === 0) {
    topbar.classList.add('cover-topbar');
    stepTextEl.textContent = '';
    wrap.innerHTML = '';
    return;
  }
  topbar.classList.remove('cover-topbar');
  stepTextEl.textContent = meta.stepText;
  wrap.innerHTML = '';
  meta.units.forEach(unit => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    if (unit.active >= 1) bar.classList.add('active');
    else if (unit.active > 0) bar.classList.add('partial');
    bar.style.setProperty('--fill', String(unit.active));
    wrap.appendChild(bar);
  });
}

function verdictText(score) {
  if (score >= 4) return ["明显成立", "high", "基础体验已经具备明确加分感。"];
  if (score >= 2.8) return ["中性成立", "mid", "基础体验大体成立，但暂时没有形成明显说服力。"];
  return ["偏弱", "low", "基础体验已经出现明显短板，需要依赖修正机制判断。"];
}

function getDimAvg(dim) {
  const visibleItems = getVisibleItems(dim);
  if (!visibleItems.length) return 3.0; // 边界保护：无可见子项时返回默认值
  const vals = visibleItems.map(i => state[i.id]);
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function getOverall() {
  const visibleDims = getVisibleDimensions();
  if (!visibleDims.length) return 3.0; // 边界保护：无可见维度时返回默认值
  return visibleDims.map(getDimAvg).reduce((a,b)=>a+b,0)/visibleDims.length;
}
function countChecked(options){
  return options.filter(([id]) => state[id]).length;
}
function downgrade(level){
  const order = ['强推荐','推荐','中性','不推荐'];
  const idx = order.indexOf(level);
  return order[Math.min(order.length - 1, idx + 1)];
}
function upgrade(level){
  const order = ['不推荐','中性','推荐','强推荐'];
  const idx = order.indexOf(level);
  return order[Math.min(order.length - 1, idx + 1)];
}
function clampLevelToNeutral(level){
  const ranking = {'强推荐':3,'推荐':2,'中性':1,'不推荐':0};
  return ranking[level] > ranking['中性'] ? '中性' : level;
}

  const expectationCount = countChecked(expectationOptions);
  const minorCount = countChecked(minorOptions);
  const valueScore = getValueScore();
  const valueLabel = getValueVerdictLabel(valueScore);
  const premiumConditionCount = getPremiumConditionKeys().length;

  // ── 第一步：结构性问题扣分 ──────────────────────────────────────
  let adjustedScore = baseScore - structuralCount * 0.3 - (structuralCount >= 2 ? 0.5 : 0);
  adjustedScore = Math.max(1, adjustedScore);

  // ── 第二步：由分数推基础等级 ────────────────────────────────────
  // 注意：此时还未施加 fatal 封顶，先得到"无 fatal 干预"的自然等级
  let level = '不推荐';
  if (adjustedScore >= 4.2) level = '强推荐';
  else if (adjustedScore >= 3.5) level = '推荐';
  else if (adjustedScore >= 2.8) level = '中性';

  // ── 第三步：致命风险压制 ────────────────────────────────────────
  // 先 clamp 再判断，保证"fatalCount=1 时上限为中性"逻辑真正生效
  if (fatalCount >= 1) level = clampLevelToNeutral(level); // 上限压到中性
  if (fatalCount >= 2) level = '不推荐';                   // 2 项及以上直接不推荐
  // 同步将 adjustedScore 封顶（用于显示，不影响等级判断）
  if (fatalCount >= 1) adjustedScore = Math.min(adjustedScore, 2.5);

  // ── 第四步：感知偏差降级 ────────────────────────────────────────
  // expectationCount >= 2：明显的预期落差，结论降一档
  // expectationCount === 1：轻微，不影响等级，仅影响文案
  if (expectationCount >= 2) level = downgrade(level);

  // ── 第五步：价值判断修正 ────────────────────────────────────────
  if (valueScore < 2.3) level = '不推荐';
  else if (valueScore < 2.8) level = downgrade(level);
  else if (valueScore >= 4.2) level = upgrade(level);
  else if (valueScore >= 3.6 && level === '中性') level = '推荐';

  // ── 第六步：溢价支撑保护 ────────────────────────────────────────
  // 无任何溢价支撑时，强推荐降为推荐
  if (premiumConditionCount === 0 && level === '强推荐') level = '推荐';

  // ── 第七步：致命风险最终兜底（防止价值判断把 fatal 结果抬回来）─
  if (fatalCount >= 2) level = '不推荐';

  return {
    baseScore,
    adjustedScore,
    fatalCount,
    structuralCount,
    expectationCount,
    minorCount,
    valueScore,
    premiumConditionCount,
    level,
    valueLabel,
  };
}

function refreshSummary() {
  const sum = document.getElementById('summary');
  sum.innerHTML = '';
  const visibleDims = getVisibleDimensions();
  const activeDimIdx = (currentStage >= DIMENSION_STAGE_START && currentStage <= getDimensionStageEnd())
    ? currentStage - DIMENSION_STAGE_START : -1;

  visibleDims.forEach((dim, idx) => {
    const avg = getDimAvg(dim);
    const pct = Math.max(0, Math.min(100, (avg / 5) * 100));
    const isActive  = idx === activeDimIdx;
    const isVisited = visitedDims.has(dim.id) && !isActive;
    const isPending = !visitedDims.has(dim.id) && !isActive;

    const row = document.createElement('div');
    row.className = 'dim-chip' +
      (isActive  ? ' dim-chip-active'  : '') +
      (isVisited ? ' dim-chip-visited' : '') +
      (isPending ? ' dim-chip-pending' : '');

    row.innerHTML = `
      <div class="dim-chip-top">
        <div>
          <div class="dim-chip-index">维度 ${idx + 1}</div>
          <div class="dim-chip-name">${dim.name}</div>
        </div>
        <div class="dim-chip-score">${avg.toFixed(1)}</div>
      </div>
      <div class="dim-chip-bar"><div class="dim-chip-fill" style="width:${pct}%"></div></div>
    `;
    sum.appendChild(row);
  });

  const overall = getOverall();
  document.getElementById('overallScore').textContent = overall.toFixed(1);
  const [text, cls, note] = verdictText(overall);
  const v = document.getElementById('overallVerdict');
  v.textContent = text;
  v.className = `verdict ${cls}`;
  document.getElementById('overallNote').textContent = note;
}

function bindContextStage(){
  const bindings = ['hotelName','city','roomType','priceRange','accommodationType','stayDate','stayNights','bookingChannel','stayPurpose','travelCompanion'];
  bindings.forEach(key => {
    const el = document.getElementById(key);
    if (!el) return;
    const eventName = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(eventName, e => { state.context[key] = e.target.value; });
    if (eventName !== 'change') el.addEventListener('change', e => { state.context[key] = e.target.value; });
  });
  document.querySelectorAll('input[name="isMember"]').forEach(radio => {
    radio.addEventListener('change', e => {
      state.context.isMember = e.target.value === 'true';
      if (!state.context.isMember) state.context.memberLevel = '';
      renderContextStage();
    });
  });
  const memberLevel = document.getElementById('memberLevel');
  if (memberLevel) memberLevel.addEventListener('input', e => { state.context.memberLevel = e.target.value; });
}

function topDimensionNames(mode='strength') {
  const sorted = getVisibleDimensions().map(dim => ({name:dim.name, avg:getDimAvg(dim)})).sort((a,b)=> mode==='strength' ? b.avg-a.avg : a.avg-b.avg);
  return sorted.slice(0,3).map(x=>x.name);
}

function premiumSummary(){
  const selected = getPremiumConditionKeys().map(key => PREMIUM_CONDITIONS[key]);
  if (!selected.length) return '未形成明确溢价逻辑';
  if (selected.length === 1) return `溢价主要来自${selected[0]}`;
  if (selected.length === 2) return `溢价主要来自${selected[0]}与${selected[1]}`;
  return `溢价主要来自${selected.slice(0,2).join('、')}，并叠加${selected[2]}支撑`;
}
function finalSummaryText(model){

  if (model.level === '推荐') return '整体体验成立，优势明确，但仍保留少量短板。';
  if (model.level === '中性') return '基础体验成立，但亮点不足，或被风险与价格判断拉回中性。';
  return '关键问题仍在，或价格逻辑未成立，不建议优先选择。';

function buildStrengthsWeaknesses(model){
  const strengths = [];
  const weaknesses = [];
  const strongDims = topDimensionNames('strength');
  const weakDims = topDimensionNames('weakness');
  const dimNameMap = {
    '区位与到达':   ['区位与到达条件具备明确优势',            '区位或到达条件对整体体验存在一定拖累'],
    '空间与设计':   ['空间与设计表达相对完整',                '空间细节或功能布局仍有欠缺'],
    '服务体系':     ['服务体系整体较稳定',                    '服务系统尚未形成稳定优势'],
    '餐饮产品':     ['餐饮系统基础能力尚可',                  '餐饮表现仍是明显短板'],
    '秩序与客群适配':['客群适配度与整体秩序表现较好',          '客群适配或秩序管理尚有提升空间'],
    '设施与运维':   ['硬件设施状态稳定，运维水准较高',         '设施状态或运维细节存在掉链子风险'],
    '商务支持能力': ['商务支持配套完整，差旅效率有明确托底',   '商务配套仍有欠缺，无法有效降低差旅摩擦']
  };
  strongDims.forEach(name => {
    if (dimNameMap[name]) strengths.push(dimNameMap[name][0]);
  });
  weakDims.forEach(name => {
    if (dimNameMap[name]) weaknesses.push(dimNameMap[name][1]);
  });

  if (model.structuralCount >= 1) weaknesses.unshift('存在结构性问题，已对整体体验形成系统性拖累');
  if (model.fatalCount >= 1) weaknesses.unshift('存在关键风险项，均分已不再具备完全解释力');

  return {
    strengths:[...new Set(strengths)].slice(0,3),
    weaknesses:[...new Set(weaknesses)].slice(0,3)
  };
}
function buildRiskList(){

      list.push(detailTitles.length ? `${title}（${detailTitles.slice(0,2).join('、')}${detailTitles.length > 2 ? ' 等' : ''}）` : title);

function buildFitLists(model){
  const fit = [];
  const unfit = [];
  const dimLocation = schema.find(d => d.id === 'location');
  const dimDesign   = schema.find(d => d.id === 'design');
  const dimService  = schema.find(d => d.id === 'service');
  const dimFb       = schema.find(d => d.id === 'fb');
  const dimVibe     = schema.find(d => d.id === 'vibe');
  const dimBusiness = schema.find(d => d.id === 'business_support');
  if (dimLocation && getDimAvg(dimLocation) >= 3.5) fit.push('更看重位置便利性与到达体验的人');
  if (dimDesign   && getDimAvg(dimDesign)   >= 3.5) fit.push('在意设计表达与空间氛围的人');
  if (dimService  && getDimAvg(dimService)  >= 3.5) fit.push('重视服务稳定性的人');
  if (model.valueScore >= 4.0) fit.push('接受一定溢价、但希望体验成立的人');
  if (getCurrentModeKey() === 'business' && dimBusiness && getDimAvg(dimBusiness) >= 3.5) fit.push('希望差旅效率被真正托住的人');

  if (dimFb   && getDimAvg(dimFb)   < 3) unfit.push('对餐饮要求较高的人');
  if (model.valueScore < 2.8 || model.premiumConditionCount === 0) unfit.push('预算敏感且强调性价比的人');
  if (state.fatal_noise || state.fatal_hygiene || state.struct_layout) unfit.push('对硬伤容忍度低的人');
  if (dimVibe && getDimAvg(dimVibe) < 3) unfit.push('非常在意人群氛围与秩序管理的人');

  return {
    fit:[...new Set(fit)].slice(0,3),
    unfit:[...new Set(unfit)].slice(0,3)
  };
}

    valueOpen: `价格与体验的匹配关系，目前落在"${value}"区间。`,

    fitOpen: (f, u) => `更适合${f}${u ? `；${u}在选择前宜仔细权衡` : ''}。`
  };

  // ── 极简一句话版：编辑标注，没有废字 ────────────────────────────
  // 目标：一句话装下判断 + 核心理由 + 核心短板 + 价格结论
  if (mode === '极简一句话版') {
    const coreReason = s1 ? `以${s1}为主要支撑` : '';
    const coreWeak = w1 ? `，${w1}是短板` : '';
    const coreRisk = r1 ? `，需注意${r1}` : '';
    const coreValue = `，价格层面${value}`;
    return `${tone.open}${coreReason}${coreWeak}${coreRisk}${coreValue}。`.replace('。。','。');
  }

  // ── 朋友圈版：有审美的朋友，分享体验，不是评分系统 ─────────────
  // 目标：像真人写出来的，不是模板生成的，有细节有留白
  if (mode === '朋友圈版') {
    const memoPart = s1;
    const regretPart = w1;
    const riskPart = r1 ? `

顺便说一句，${r1}——这件事我觉得还是应该提前知道。` : '';
    const valuePart = value === '明显值得' || value === '略有惊喜'
      ? `住完觉得钱花得值，${premium ? premium + '，' : ''}这是主要原因。`
      : value === '明显不值' || value === '略微不值'
        ? `但说实话，这个价格有点难说服我下次还选它。`
        : `价格方面，我觉得大体算是${value}，没有惊喜，也不算踩坑。`;
    return `${tone.open}

${memoPart}，是让我觉得住这里没白来的地方。${regretPart ? `但${regretPart}，住完之后还是有点如鲠在喉。` : ''}${riskPart}

${valuePart}${fit1 ? `

更适合${fit1}${fit2 ? `，或者${fit2}` : ''}来住。${unfit1 ? `对${unfit1}来说，可能会有些落差。` : ''}` : ''}`;
  }

  // ── 小红书版：有观点的种草/避雷，去掉符号堆砌，有判断感 ─────────
  // 目标：不是清单，是有立场的一段话，让人读完知道该不该去
  if (mode === '小红书版') {
    const worthIt = value === '明显值得' || value === '略有惊喜';
    const notWorth = value === '明显不值' || value === '略微不值';
    const pros = [s1, s2].filter(Boolean).join('和');
    const cons = [w1, w2].filter(Boolean).join('、');
    const riskLine = r1 ? `还有一点要特别说明：${r1}${r2 ? `，以及${r2}` : ''}，这不是小概率事件。` : '';
    const valueVerdict = worthIt
      ? `价格这件事，我觉得是成立的。`
      : notWorth
        ? `价格方面，说实话有点难说服我。`
        : `价格和体验，大体算是打平，不亏也没惊喜。`;
    return `${tone.open}

先说最重要的：${pros ? `${pros}是它真正拿得出手的地方` : '整体体验基本成立'}。${cons ? `但${cons}，这个问题实际住下来感受比想象中明显。` : ''}${riskLine ? `

${riskLine}` : ''}

${valueVerdict}${premium ? `背后的支撑主要是${premium}。` : ''}

${fit1 ? `适合${fit1}${fit2 ? `或${fit2}` : ''}去住。${unfit1 ? `不太适合${unfit1}。` : ''}` : ''}`;
  }

  // ── 平台短评版：高效消费者，直给结论，不解释推理 ────────────────
  // 目标：信息密度高，读一遍就知道要不要订，没有铺垫
  if (mode === '平台短评版') {
    const prosStr = [s1, s2].filter(Boolean).join('、');
    const consStr = [w1, w2].filter(Boolean).join('、');
    const riskStr = r1 ? `${r1}${r2 ? `、${r2}` : ''}需提前了解。` : '';
    const valueStr = `价格${value}${premium ? `，${premium}` : ''}。`;
    const fitStr = fit1 ? `推荐${fit1}${fit2 ? `、${fit2}` : ''}；${unfit1 ? `不建议${unfit1}` : ''}。` : '';
    return `${tone.open}亮点：${prosStr || '基础体验成立'}。短板：${consStr || '暂无突出问题'}。${riskStr}${valueStr}${fitStr}`;
  }

  // ── 专业评价版（默认）：分析师视角，论据驱动，逻辑链完整 ─────────
  // 目标：每一段有独立论点，段间有逻辑递进，不是清单式堆叠
  const hasStrengths = s1;
  const hasWeakness = w1;
  const hasRisk = r1;
  const minorCount = model.minorCount || 0;
  const expectationCount = model.expectationCount || 0;

  // 核心成立理由段
  const foundationBlock = s2
    ? `${s1}，以及${s2}，共同构成了这次判断能够成立的主要依据${s3 ? `；${s3}在细节层面亦有加分` : ''}。这两个方向的表现，足以支撑当前等级的基础可信度。`
    : `${s1}，是本次判断得以成立的核心支撑。单凭这一点，它在同类产品中已经具备一定辨识度。`;

  // 短板段：minorCount >= 1 时末尾补充细节瑕疵说明
  const minorSuffix = minorCount >= 1
    ? `此外存在${minorCount >= 3 ? '较多' : '若干'}可接受的细节瑕疵，不影响整体判断，但值得提前知悉。`
    : '';
  const weakBlock = hasWeakness
    ? `但${w1}${w2 ? `以及${w2}` : ''}，是评价中无法被均分掩盖的真实短板。这类问题的特点是不会因为其他维度表现良好而自动消解——它会在特定时刻以非常具体的方式影响入住体验。${minorSuffix ? ` ${minorSuffix}` : ''}`
    : minorSuffix || '';

  // 感知偏差段：expectationCount >= 1 时说明预期落差
  const expectationBlock = expectationCount >= 1
    ? `需要额外指出的是，${expectationCount >= 2 ? '多处' : ''}宣传与实际体验之间存在一定落差，这类预期偏差不直接体现在维度分数中，但会影响入住后的整体满意度判断。`
    : '';

  // 风险段
  const riskBlock = hasRisk
    ? `在风险层面，${r1}${r2 ? `以及${r2}` : ''}值得单独说明。不是因为它们一定会发生，而是一旦触发，这类问题会直接影响整体体验的底线判断，而不只是局部扣分。`
    : '';

  // 价值段
  const valueBlock = `${tone.valueOpen}${premium ? `${premium}，构成了当前价格最主要的解释依据。` : ''}这一判断独立于体验维度本身，直接回应的是"在同价位里，这是不是值得优先选择"的问题。`;

  // 适配段
  const fitBlock = tone.fitOpen(fit1, unfit1);

  return `${tone.open}

${foundationBlock}${weakBlock ? `

${weakBlock}` : ''}${expectationBlock ? `

${expectationBlock}` : ''}${riskBlock ? `

${riskBlock}` : ''}

${valueBlock}

${fitBlock}`;
}

function buildMergedFinalText(baseText){
  const extra = [];
  if (state.riskNote && state.riskNote.trim()) extra.push(`补充说明：${state.riskNote.trim()}`);
  if (state.noteMemorable && state.noteMemorable.trim()) extra.push(`我印象最深的：${state.noteMemorable.trim()}`);
  if (state.noteDissatisfied && state.noteDissatisfied.trim()) extra.push(`我最不满意的：${state.noteDissatisfied.trim()}`);
  if (state.noteOneLine && state.noteOneLine.trim()) extra.push(`一句话感受：${state.noteOneLine.trim()}`);
  if (state.noteRevisit && state.noteRevisit.trim()) extra.push(`我会不会再来：${state.noteRevisit.trim()}`);
  if (state.noteOther && state.noteOther.trim()) extra.push(`其他补充：${state.noteOther.trim()}`);
  return extra.length ? `${baseText}\n\n${extra.join('\n')}` : baseText;
}
function updateFinalTextarea(){
  const finalTextEl = document.getElementById('finalText');
  const mapping = {
    noteMemorable: 'subjectiveMemorable',
    noteDissatisfied: 'subjectiveDissatisfied',
    noteOneLine: 'subjectiveOneLine',
    noteRevisit: 'subjectiveRevisit',
    noteOther: 'subjectiveOther'
  };
  Object.entries(mapping).forEach(([key, id]) => {
    const el = document.getElementById(id);
    if (el) state[key] = el.value;
  });
  if (finalTextEl) {
    const model = JSON.parse(finalTextEl.dataset.model || '{}');
    const strengths = JSON.parse(finalTextEl.dataset.strengths || '[]');
    const weaknesses = JSON.parse(finalTextEl.dataset.weaknesses || '[]');
    const risks = JSON.parse(finalTextEl.dataset.risks || '[]');
    const fitLists = JSON.parse(finalTextEl.dataset.fit || '{"fit":[],"unfit":[]}');
    const baseText = buildTextByModeStyle(model, strengths, weaknesses, risks, fitLists);
    finalTextEl.value = buildMergedFinalText(baseText);
  }
  refreshWritingControls();
}

function buildFinalText(model, strengths, weaknesses, risks, fitLists){
  return buildTextByModeStyle(model, strengths, weaknesses, risks, fitLists);
}

function toggleState(key, value){
  state[key] = value;
  if (!value) {
    // 清除所有子项 state（彻底清理，不依赖 clearRiskDetails）
    if (riskDetailMap[key]) {
      riskDetailMap[key].forEach(([id]) => { state[id] = false; });
    }
    clearRiskDetails(key);
    state.uiExpanded[key] = false;
  }
  refreshSummary();
  if (currentStage === getRiskStage()) render(false);
}
function toggleRiskDetail(parentId, key, value){
  state[key] = value;
  if (value) {
    state[parentId] = true;
  } else if (!(riskDetailMap[parentId] || []).some(([id]) => state[id])) {
    state[parentId] = false;
  }
  refreshSummary();
  if (currentStage === getRiskStage()) render(false);
}

function togglePremiumCondition(key, checked){
  state[key] = checked;
  refreshSummary();
  if (currentStage === getValueStage()) renderValueStage();
}

function setValueChoice(value){ state.valueChoice = value; refreshSummary(); }
function setRevisitChoice(value){ state.revisitChoice = value; refreshSummary(); }
function setChoice(group, value){ state[group] = value; refreshSummary(); }

function goPrev(){
  if (currentStage > 0) {
    currentStage -= 1;
    renderWithTransition();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function goNext(){
  if (currentStage === 2 && (!state.context.hotelName || !state.context.city)) {
    alert('请至少填写酒店名称和城市。');
    return;
  }
  if (currentStage < getResultStage()) {
    currentStage += 1;
    renderWithTransition();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function copyText(){
  const text = document.getElementById('finalText');
  if (!text) return;
  text.select();
  text.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
  } catch (e) {}
}
function downloadResult(){
  const model = getFinalModel();
  const points = Math.round((model.adjustedScore / 5) * 100);
  const content = document.getElementById('finalText') ? document.getElementById('finalText').value : '';
  const blob = new Blob([`StayLens Result

结论：${model.level} / ${model.valueLabel} / ${model.valueScore.toFixed(1)}分
分值：${points} / 100
基础均分：${model.baseScore.toFixed(1)}
修正后分值：${model.adjustedScore.toFixed(1)}

${content}`], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `StayLens_Result_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ─── 对比记录：localStorage 存取 ─────────────────────────────── */
const COMPARE_KEY = 'staylens_compare_records';

function loadCompareRecords() {
  try {
    return JSON.parse(localStorage.getItem(COMPARE_KEY) || '[]');
  } catch(e) { return []; }
}

function saveCurrentToCompare() {
  const model = getFinalModel();
  const points = Math.round((model.adjustedScore / 5) * 100);
  const hotelName = (state.context && state.context.hotelName) ? state.context.hotelName : '未命名酒店';
  const city = (state.context && state.context.city) ? state.context.city : '';
  const priceRange = (state.context && state.context.priceRange) ? state.context.priceRange : '';
  const record = {
    id: Date.now(),
    savedAt: new Date().toLocaleDateString('zh-CN'),
    hotelName,
    city,
    priceRange,
    points,
    level: model.level,
    valueLabel: model.valueLabel,
    baseScore: model.baseScore.toFixed(2),
    adjustedScore: model.adjustedScore.toFixed(2),
    valueScore: model.valueScore.toFixed(2),
    fatalCount: model.fatalCount,
    dims: getVisibleDimensions().map(dim => ({
      name: dim.name,
      score: getDimAvg(dim).toFixed(1)
    }))
  };
  const records = loadCompareRecords();
  // 同名酒店覆盖旧记录
  const existingIdx = records.findIndex(r => r.hotelName === hotelName && r.city === city);
  if (existingIdx >= 0) {
    if (!confirm(`已有「${hotelName}」的评价记录，是否覆盖？`)) return;
    records.splice(existingIdx, 1);
  }
  records.unshift(record);
  // 最多保留 10 条
  if (records.length > 10) records.splice(10);
  try {
    localStorage.setItem(COMPARE_KEY, JSON.stringify(records));
    renderCompareBlock();
    // 按钮反馈
    const btn = document.getElementById('saveCompareBtn');
    if (btn) { btn.textContent = '已保存 ✓'; setTimeout(() => { btn.textContent = '保存当前结果'; }, 1800); }
  } catch(e) { alert('保存失败，浏览器存储可能已满。'); }
}

function deleteCompareRecord(id) {
  const records = loadCompareRecords().filter(r => r.id !== id);
  localStorage.setItem(COMPARE_KEY, JSON.stringify(records));
  renderCompareBlock();
}

function clearAllCompareRecords() {
  if (!confirm('确定清空所有对比记录？')) return;
  localStorage.removeItem(COMPARE_KEY);
  renderCompareBlock();
}

function renderCompareBlock() {
  const wrap = document.getElementById('compareBlock');
  if (!wrap) return;
  const records = loadCompareRecords();
  if (!records.length) {
    wrap.innerHTML = `<p style="font-family:var(--font-body);font-size:var(--ts-13);color:rgba(92,82,72,.42);margin:0;font-style:italic;">暂无对比记录。完成评价后点击「保存当前结果」即可存入。</p>`;
    return;
  }
  wrap.innerHTML = records.map(r => `
    <div class="compare-row">
      <div class="compare-row-main">
        <div class="compare-hotel">
          <span class="compare-name">${escapeHtml(r.hotelName)}</span>
          ${r.city ? `<span class="compare-city">${escapeHtml(r.city)}</span>` : ''}
        </div>
        <div class="compare-meta">${r.savedAt}${r.priceRange ? ' · ' + escapeHtml(r.priceRange) : ''}</div>
      </div>
      <div class="compare-row-scores">
        <div class="compare-score-block">
          <span class="compare-score-num">${r.points}</span>
          <span class="compare-score-unit">/ 100</span>
        </div>
        <span class="verdict ${r.level==='不推荐'?'low':r.level==='中性'?'mid':'high'}" style="font-size:11px;padding:3px 8px;">${r.level}</span>
        <span class="compare-value-label">${r.valueLabel}</span>
      </div>
      <button class="compare-delete" onclick="deleteCompareRecord(${r.id})" title="删除此记录">×</button>
    </div>
  `).join('');
}

/*
 * positionScoreElements()
 * – Positions tick numbers precisely above the slider thumb travel range
 * – Shows a single active label below the thumb, clamped to not overflow
 */
function getThumbR() {
  return navigator.userAgent.toLowerCase().includes('firefox') ? 8.5 : 8;
}

function getThumbLeftPx(slider) {
  const trackW = slider.getBoundingClientRect().width;
  const thumbR = getThumbR();
  const ratio = (parseFloat(slider.value) - parseFloat(slider.min)) /
                (parseFloat(slider.max) - parseFloat(slider.min));
  return thumbR + ratio * (trackW - 2 * thumbR);
}

function getNearestAnchor(val) {
  const anchors = [1, 3, 5];
  return anchors.reduce((a, b) => Math.abs(b - val) < Math.abs(a - val) ? b : a);
}

function updateActiveLabel(grid, slider) {
  const trackW = slider.getBoundingClientRect().width;
  if (!trackW) return;

  const thumbR  = getThumbR();
  const val     = parseFloat(slider.value);
  const min     = parseFloat(slider.min);
  const max     = parseFloat(slider.max);
  const ratio   = (val - min) / (max - min);
  const thumbPx = thumbR + ratio * (trackW - 2 * thumbR);

  const label = grid.querySelector('.score-active-label');
  if (!label) return;

  // Set text first
  const nearestKey = getNearestAnchor(val);
  label.textContent = grid.getAttribute('data-anchor-' + nearestKey) || '';

  // Edge threshold: within this many px of each edge, switch alignment
  const edgeThreshold = trackW * 0.22; // ~22% from each edge

  if (thumbPx <= edgeThreshold) {
    // Left zone: left edge of label anchored to thumb, text flows right
    label.style.left      = (thumbPx / trackW * 100).toFixed(2) + '%';
    label.style.right     = 'auto';
    label.style.transform = 'none';
    label.style.textAlign = 'left';
  } else if (thumbPx >= trackW - edgeThreshold) {
    // Right zone: right edge of label anchored to thumb, text flows left
    // Use translateX(-100%) so the right edge sits at thumbPx — no overflow
    label.style.left      = (thumbPx / trackW * 100).toFixed(2) + '%';
    label.style.right     = 'auto';
    label.style.transform = 'translateX(-100%)';
    label.style.textAlign = 'right';
  } else {
    // Centre zone: centre label on thumb
    label.style.left      = (thumbPx / trackW * 100).toFixed(2) + '%';
    label.style.right     = 'auto';
    label.style.transform = 'translateX(-50%)';
    label.style.textAlign = 'center';
  }
}

function positionScoreElements() {
  document.querySelectorAll('.score-grid').forEach(grid => {
    const slider = grid.querySelector('input[type="range"]');
    if (!slider) return;
    const trackW = slider.getBoundingClientRect().width;
    if (!trackW) return;

    const min    = parseFloat(slider.min) || 1;
    const max    = parseFloat(slider.max) || 5;
    const thumbR = getThumbR();

    // Position ticks
    const ticksWrap = grid.querySelector('.score-tick-row-inner');
    if (ticksWrap) {
      ticksWrap.querySelectorAll('.score-tick').forEach(tick => {
        const val   = parseFloat(tick.dataset.val);
        const ratio = (val - min) / (max - min);
        const xPct  = ((thumbR + ratio * (trackW - 2 * thumbR)) / trackW * 100).toFixed(3);
        tick.style.left = xPct + '%';
      });
    }

    // Update active label
    updateActiveLabel(grid, slider);
  });
}

function render(shouldAnimate = true) {
  buildProgress();
  refreshSummary();
  const meta = stageMeta();
  document.getElementById('heroTitle').textContent = meta.title;
  document.getElementById('heroDesc').textContent = meta.desc;
  document.getElementById('heroHint').textContent = meta.hint;
  document.getElementById('summaryStrip').style.display = (currentStage <= 2 || currentStage === getResultStage()) ? 'none' : 'grid';
  document.getElementById('heroSection').style.display = (currentStage <= 2) ? 'none' : 'block';

  if (currentStage === 0) {
    renderCoverStage();
  } else {
    document.body.style.overflow = '';
    if (currentStage === 1) {
      renderModeStage();
    } else if (currentStage === 2) {
      renderContextStage();
    } else if (currentStage >= DIMENSION_STAGE_START && currentStage <= getDimensionStageEnd()) {
      renderDimensionStage();
    } else if (currentStage === getRiskStage()) {
      renderRiskStage();
    } else if (currentStage === getValueStage()) {
      renderValueStage();
    } else {
      renderResultStage();
    }
  }

  const host = document.getElementById('pageHost');
  const shell = host.firstElementChild;
  if (shell && shouldAnimate) {
    shell.classList.remove('stage-shell-enter');
    void shell.offsetWidth;
    shell.classList.add('stage-shell-enter');
  }
}

function renderWithTransition() {
  const host = document.getElementById('pageHost');
  const currentView = host.firstElementChild;
  if (!currentView) {
    render();
    return;
  }
  currentView.classList.remove('stage-shell-enter');
  currentView.classList.add('stage-shell-exit');
  setTimeout(() => {
    render();
    // After DOM settles, position score elements precisely
    requestAnimationFrame(() => requestAnimationFrame(positionScoreElements));
  }, 140);
}

render();
// Position on initial load
requestAnimationFrame(() => requestAnimationFrame(positionScoreElements));
// Reposition on window resize
window.addEventListener('resize', positionScoreElements);

/* ─── 进度自动保存与恢复 ───────────────────────────────────────────
   保存时机：每次切换页面（goNext / goPrev）
   恢复时机：页面加载时，检测到草稿则提示恢复
   键名与对比记录分开，互不干扰
─────────────────────────────────────────────────────────────────── */
const DRAFT_KEY = 'staylens_draft';

function saveDraft() {
  // 只在进入评价流程后才保存（stage > 0），封面不保存
  if (currentStage === 0) return;
  try {
    const draft = {
      savedAt: Date.now(),
      currentStage,
      // 只序列化可安全 JSON 化的 state 字段
      state: {
        modeSetup: state.modeSetup,
        context: state.context,
        outputMode: state.outputMode,
        writingStyle: state.writingStyle,
        riskNote: state.riskNote,
        noteMemorable: state.noteMemorable,
        noteDissatisfied: state.noteDissatisfied,
        noteOneLine: state.noteOneLine,
        noteRevisit: state.noteRevisit,
        noteOther: state.noteOther,
        valueChoice: state.valueChoice,
        uiExpanded: state.uiExpanded,
      }
    };
    // 维度分数
    schema.forEach(dim => dim.items.forEach(item => {
      draft.state[item.id] = state[item.id];
    }));
    // 价值子项
    Object.keys(VALUE_SUBITEMS).forEach(id => { draft.state[id] = state[id]; });
    // 溢价条件
    Object.keys(PREMIUM_CONDITIONS).forEach(id => { draft.state[id] = state[id]; });
    // 风险选项
    [...fatalOptions, ...structuralOptions, ...layoutDetailOptions,
     ...expectationOptions, ...minorOptions, ...premiumOptions].forEach(([id]) => {
      draft.state[id] = state[id];
    });
    Object.values(riskDetailMap).flat().forEach(([id]) => { draft.state[id] = state[id]; });
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
  } catch(e) { /* 存储失败静默处理 */ }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
}

function restoreDraft(draft) {
  try {
    Object.assign(state, draft.state);
    // 恢复 visitedDims：根据保存时的 stage 重建已访问集合
    visitedDims.clear();
    const dims = getVisibleDimensions();
    const restoredStage = draft.currentStage;
    if (restoredStage >= DIMENSION_STAGE_START) {
      // 已经过了维度评分阶段或正在其中
      // 把已完成的维度（当前 stage 之前的）全部标记为已访问
      const completedCount = restoredStage >= getRiskStage()
        ? dims.length  // 风险页及之后：所有维度都已访问
        : restoredStage - DIMENSION_STAGE_START; // 正在某个维度：之前的都已访问
      dims.forEach((dim, idx) => {
        if (idx < completedCount) visitedDims.add(dim.id);
      });
    }
    currentStage = restoredStage;
    render();
    requestAnimationFrame(() => requestAnimationFrame(positionScoreElements));
  } catch(e) { console.error('草稿恢复失败', e); }
}

// 页面加载时检测草稿
(function checkDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return;
    const draft = JSON.parse(raw);
    if (!draft || !draft.savedAt || !draft.currentStage) return;
    // 超过 7 天的草稿自动丢弃
    if (Date.now() - draft.savedAt > 7 * 24 * 60 * 60 * 1000) {
      clearDraft();
      return;
    }
    const hotelName = (draft.state && draft.state.context && draft.state.context.hotelName)
      ? `「${draft.state.context.hotelName}」` : '';
    const savedTime = new Date(draft.savedAt).toLocaleString('zh-CN', {
      month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    if (confirm(`检测到未完成的评价${hotelName}（${savedTime}），是否继续上次进度？`)) {
      restoreDraft(draft);
    } else {
      clearDraft();
    }
  } catch(e) {}
})();

// 在 goNext / goPrev 时自动保存
const _origGoNext = goNext;
goNext = function() {
  _origGoNext();
  saveDraft();
};
const _origGoPrev = goPrev;
goPrev = function() {
  _origGoPrev();
  saveDraft();
};

// 到达结果页时清除草稿（已完成）
const _origRenderResultStage = renderResultStage;
renderResultStage = function() {
  _origRenderResultStage();
  clearDraft();
};
</script>
